# ref: https://github.com/actions/runner-images
name: amd64 MacOS CMake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Each run on main gets its own group, so that main runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/main' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        # Varies the operating system (macOS) and architecture (amd64) from the
        # origin in amd64_linux_cmake.yml, keeping CMake 3.28, Release, and
        # C++17 fixed. Python and CMake generator variations are tested on
        # Linux; keeping macOS CMake to a single job also stays well below
        # GitHub Actions' 5-concurrent-macOS-runner cap.
        include:
          # - {runner: macos-26-intel, generator: Xcode, config: Release, build_target: ALL_BUILD, test_target: RUN_TESTS, install_target: install, cpp: 17, python: '3.12'}
          - {runner: macos-26-intel, generator: "Unix Makefiles", config: Release, build_target: all, test_target: test, install_target: install, cpp: 17, python: '3.12'}
      fail-fast: false
    name: ${{matrix.runner}}•CMake(${{matrix.generator}})•C++${{matrix.cpp}}•Py${{matrix.python}}
    runs-on: ${{matrix.runner}}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python}}
      - name: Update Path
        run: |
          echo "$HOME/Library/Python/${{matrix.python}}/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Check Python
        run: |
          python --version
          python -m platform
      - name: Install Python requirements
        run: python -m pip install --upgrade -r $(python -c 'import sys; print("./pybind11_protobuf/requirements/requirements_lock_%d_%d.txt" % (sys.version_info[:2]))')
      - name: Check CMake
        run: cmake --version
      - name: Configure
        run: >
          cmake -S. -Bbuild
          -G "${{matrix.generator}}"
          -DCMAKE_BUILD_TYPE=${{matrix.config}}
          -DCMAKE_CONFIGURATION_TYPES=${{matrix.config}}
          -DCMAKE_CXX_STANDARD=${{matrix.cpp}}
          -DCMAKE_INSTALL_PREFIX=install
      - name: Build
        run: >
          cmake --build build
          --config ${{matrix.config}}
          --target ${{matrix.build_target}}
          -v -j2
      - name: Test
        run: >
          CTEST_OUTPUT_ON_FAILURE=1
          cmake --build build
          --config ${{matrix.config}}
          --target ${{matrix.test_target}}
          -v
      - name: Install
        run: >
          cmake --build build
          --config ${{matrix.config}}
          --target ${{matrix.install_target}}
          -v

  amd64_macos_cmake:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
